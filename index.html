<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AstroChat · Tutor IA de Astronomía</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #eef2f5;
      --surface: #ffffff;
      --primary: #2c3e66;
      --primary-light: #4a6fa5;
      --accent: #ffb347;
      --text: #1e2a3a;
      --text-light: #4a5b6e;
      --border: #cbd7e4;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --bubble-bot: #f0f4f9;
      --bubble-user: #2c3e66;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 1.2rem;
      text-align: center;
      border-radius: 0 0 32px 32px;
      box-shadow: var(--shadow);
      position: relative;
    }
    .header h1 {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .header p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 0.3rem;
    }
    /* Botón oculto para administradores (doble clic) */
    .admin-area {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 0.6rem;
      opacity: 0.3;
      cursor: pointer;
    }
    .admin-area:hover {
      opacity: 1;
    }

    .chat-container {
      max-width: 800px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 50vh;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .message {
      max-width: 85%;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .bot {
      background: var(--bubble-bot);
      border-left: 4px solid var(--primary-light);
      align-self: flex-start;
    }
    .user {
      background: var(--bubble-user);
      color: white;
      align-self: flex-end;
      border-radius: 20px 20px 4px 20px;
    }
    .timestamp {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 0.4rem;
      text-align: right;
    }
    .typing {
      display: flex;
      gap: 6px;
      padding: 0.6rem 1rem;
      background: white;
      border-radius: 30px;
      width: fit-content;
      border-left: 3px solid var(--primary-light);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    @keyframes bounce {
      0%,80%,100%{ transform: scale(0); }
      40%{ transform: scale(1); }
    }

    .input-area {
      max-width: 800px;
      margin: 0 auto;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      position: sticky;
      bottom: 70px;
      background: var(--bg);
    }
    .input-area input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 60px;
      font-size: 1rem;
      background: white;
    }
    .input-area button {
      background: var(--primary);
      border: none;
      width: 48px;
      border-radius: 60px;
      cursor: pointer;
      color: white;
    }

    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem;
      border-top: 1px solid var(--border);
      z-index: 100;
      flex-wrap: wrap;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 40px;
      cursor: pointer;
      gap: 4px;
    }
    .menu-item:hover {
      background: var(--border);
    }
    .emergency-btn {
      position: fixed;
      bottom: 90px;
      right: 16px;
      background: #e07a6a;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 200;
      box-shadow: var(--shadow);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      max-width: 500px;
      width: 90%;
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
      max-height: 80vh;
      overflow-y: auto;
    }
    .quiz-question {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 0.7rem 1rem;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    .quiz-option:hover {
      background: var(--primary-light);
      color: white;
    }
    .score-area {
      margin-top: 1rem;
      font-weight: bold;
    }
    footer {
      text-align: center;
      font-size: 0.7rem;
      padding: 1rem;
      color: #6c757d;
    }
    /* Admin modal */
    .admin-modal {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -20%);
      background: white;
      padding: 1.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 300;
      display: none;
      width: 90%;
      max-width: 400px;
    }
    .admin-modal input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 40px;
      border: 1px solid var(--border);
    }
    .admin-modal button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem;
      border-radius: 40px;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .message { max-width: 95%; }
      .bottom-menu span { font-size: 0.6rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🚀 AstroChat</h1>
  <p>Tutor IA de Astronomía · Para estudiantes curiosos</p>
  <div class="admin-area" id="adminArea" title="Doble clic para administrador">⚙️</div>
</div>

<div class="chat-container">
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Pregunta sobre estrellas, planetas, agujeros negros..." autocomplete="off">
    <button id="sendBtn">📨</button>
  </div>
</div>

<div class="bottom-menu">
  <button class="menu-item" data-topic="Sistema Solar">🌍<span>Sistema Solar</span></button>
  <button class="menu-item" data-topic="Estrellas">⭐<span>Estrellas</span></button>
  <button class="menu-item" data-topic="Galaxias">🌀<span>Galaxias</span></button>
  <button class="menu-item" data-topic="Agujeros negros">🕳️<span>Agujeros negros</span></button>
  <button class="menu-item" data-topic="Observación del cielo">🔭<span>Observar</span></button>
  <button class="menu-item" data-topic="Misiones espaciales">🚀<span>Misiones</span></button>
  <button class="menu-item" id="summaryBtn">📄<span>Resumen</span></button>
  <button class="menu-item" id="gameBtn">🎮<span>Juego</span></button>
</div>

<button class="emergency-btn" id="emergencyBtn">🚨 Salir rápido</button>

<!-- Modal del juego -->
<div id="quizModal" class="modal">
  <div class="modal-content">
    <h2>🔭 Quiz Astronómico</h2>
    <div id="quizArea"></div>
    <button id="closeQuiz" style="margin-top: 1rem; background:#ccc; border:none; padding:0.5rem; border-radius:20px;">Cerrar</button>
  </div>
</div>

<!-- Modal para administrador (cambiar URL) -->
<div id="adminModal" class="admin-modal">
  <h3>🔧 Configuración avanzada</h3>
  <p>URL del Worker (solo cambiar si es necesario):</p>
  <input type="text" id="adminWorkerUrl" placeholder="https://...workers.dev">
  <button id="saveAdminUrl">Guardar</button>
  <button id="closeAdminModal" style="background:#ccc; margin-left:0.5rem;">Cancelar</button>
</div>

<footer>🔭 Las respuestas son generadas por IA (Groq 70B). Aprende y diviértete.</footer>

<script>
  // ============================================
  // CONFIGURACIÓN: URL del Worker (preconfigurada)
  // ============================================
  let workerUrl = localStorage.getItem('astroWorkerUrl') || 'https://astro-groq-worker.dianaml76.workers.dev';
  
  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  
  let chatHistory = [];
  let currentSummaryText = '';

  // Funciones auxiliares
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = `${text}<div class="timestamp">${time}</div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    if (role === 'user') {
      chatHistory.push({ role: 'user', content: text });
    } else if (role === 'bot') {
      chatHistory.push({ role: 'assistant', content: text });
    }
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
  }

  let typingDiv = null;
  function showTyping(show) {
    if (show && !typingDiv) {
      typingDiv = document.createElement('div');
      typingDiv.className = 'typing';
      typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else if (!show && typingDiv) {
      typingDiv.remove();
      typingDiv = null;
    }
  }

  async function askGroq(userMessage, isSummary = false) {
    if (!workerUrl) {
      addMessage('bot', '⚠️ No se ha configurado la URL del Worker. Contacta al administrador.');
      return null;
    }
    let messagesToSend = chatHistory.concat({ role: 'user', content: userMessage });
    // Para resúmenes, podemos ajustar el mensaje directamente
    if (isSummary) {
      messagesToSend = [{ role: 'user', content: userMessage }];
    }
    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesToSend })
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `HTTP ${response.status}`);
      }
      const data = await response.json();
      return data.reply;
    } catch (error) {
      console.error(error);
      addMessage('bot', '🔌 Error de conexión con el tutor IA. Contacta al administrador.');
      return null;
    }
  }

  async function sendMessage(message, skipAddUser = false) {
    if (!message.trim()) return;
    if (!skipAddUser) addMessage('user', message);
    
    // Detectar si pide resumen descargable
    const esResumen = /resumen descargable|resumen en pdf|genera un resumen|resumen de/i.test(message);
    showTyping(true);
    let reply;
    if (esResumen) {
      let tema = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim();
      if (!tema) tema = "astronomía";
      const promptResumen = `Genera un resumen extenso sobre "${tema}" de al menos 400 palabras, adecuado para estudiantes de 12 a 18 años. Incluye título, introducción, puntos clave y conclusión. Usa párrafos claros. No uses lenguaje técnico complejo.`;
      reply = await askGroq(promptResumen, true);
    } else {
      reply = await askGroq(message);
    }
    showTyping(false);
    if (reply) {
      addMessage('bot', reply);
      if (esResumen) {
        const lastMsg = messagesDiv.lastChild;
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = '📥 Descargar PDF';
        downloadBtn.style.marginTop = '10px';
        downloadBtn.style.padding = '6px 12px';
        downloadBtn.style.borderRadius = '20px';
        downloadBtn.style.border = 'none';
        downloadBtn.style.background = '#4a6fa5';
        downloadBtn.style.color = 'white';
        downloadBtn.style.cursor = 'pointer';
        const temaParaPDF = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim() || "Astronomía";
        downloadBtn.onclick = () => generatePDF(temaParaPDF, reply);
        lastMsg.appendChild(downloadBtn);
      }
    } else {
      addMessage('bot', 'Lo siento, no pude obtener respuesta. Contacta al administrador.');
    }
  }

  function generatePDF(title, content) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica');
    doc.setFontSize(18);
    doc.text(`Resumen: ${title}`, 20, 20);
    doc.setFontSize(12);
    const splitText = doc.splitTextToSize(content, 170);
    doc.text(splitText, 20, 35);
    doc.save(`resumen_${title.replace(/ /g,'_')}.pdf`);
  }

  // Menús temáticos
  document.querySelectorAll('.menu-item[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      const topic = btn.getAttribute('data-topic');
      sendMessage(`Explícame sobre ${topic} de forma divertida y sencilla para un estudiante de secundaria.`);
    });
  });

  document.getElementById('summaryBtn').addEventListener('click', async () => {
    const topic = prompt('¿De qué tema astronómico quieres un resumen de una hoja? (ej: agujeros negros, Marte, telescopios)');
    if (!topic) return;
    sendMessage(`Haz un resumen descargable de ${topic}`);
  });

  // Juego (quiz)
  const quizModal = document.getElementById('quizModal');
  const quizArea = document.getElementById('quizArea');
  let currentQuestions = [], currentIndex = 0, score = 0;
  let bestScore = localStorage.getItem('astroBestScore') || 0;

  const questionBank = [
    { text: "¿Cuál es el planeta más grande del Sistema Solar?", options: ["Marte", "Júpiter", "Saturno", "Neptuno"], correct: "Júpiter" },
    { text: "¿Qué estrella es el centro de nuestro sistema planetario?", options: ["Sirio", "Próxima Centauri", "El Sol", "Vega"], correct: "El Sol" },
    { text: "¿Qué galaxia es la vecina más cercana a la Vía Láctea?", options: ["Andrómeda", "Triángulo", "Remolino", "Ojo de Cerradura"], correct: "Andrómeda" },
    { text: "¿Qué es un agujero negro?", options: ["Una estrella muerta", "Una región con gravedad extrema que ni la luz escapa", "Un planeta oscuro", "Una nube de gas"], correct: "Una región con gravedad extrema que ni la luz escapa" },
    { text: "¿Cuál es la temperatura aproximada de la superficie del Sol?", options: ["5,500 °C", "15 millones °C", "1,000 °C", "100 °C"], correct: "5,500 °C" },
    { text: "¿Qué telescopio espacial nos ha dado imágenes increíbles del universo desde 1990?", options: ["Hubble", "James Webb", "Spitzer", "Kepler"], correct: "Hubble" },
    { text: "¿Cuántos planetas tiene el Sistema Solar (sin contar Plutón como planeta)?", options: ["7", "8", "9", "10"], correct: "8" },
    { text: "¿Qué misión puso el primer humano en la Luna?", options: ["Apolo 11", "Artemis 1", "Gemini 4", "Sputnik"], correct: "Apolo 11" },
    { text: "¿Qué es una supernova?", options: ["Una estrella que explota al final de su vida", "Un cometa gigante", "Una luna nueva", "Un agujero de gusano"], correct: "Una estrella que explota al final de su vida" },
    { text: "¿Cuál es el planeta conocido como el 'gigante gaseoso' de color azul verdoso?", options: ["Urano", "Júpiter", "Saturno", "Neptuno"], correct: "Neptuno" },
    { text: "¿Qué fenómeno ocurre cuando la Luna se interpone entre el Sol y la Tierra?", options: ["Eclipse solar", "Eclipse lunar", "Marea alta", "Aurora boreal"], correct: "Eclipse solar" },
    { text: "¿Qué objeto del cielo profundo es famoso por sus anillos visibles?", options: ["Nebulosa de Orión", "Galaxia del Sombrero", "Saturno", "Cúmulo de las Pléyades"], correct: "Saturno" },
    { text: "¿Qué nombre recibe la estrella más cercana al Sol?", options: ["Próxima Centauri", "Alfa Centauri", "Barnard", "Sirio"], correct: "Próxima Centauri" },
    { text: "¿Qué misión actual estudia el subsuelo de Marte?", options: ["Perseverance", "Curiosity", "InSight", "Mars Express"], correct: "InSight" },
    { text: "¿Cuál es el planeta más caliente del Sistema Solar (por su densa atmósfera)?", options: ["Mercurio", "Venus", "Marte", "Júpiter"], correct: "Venus" }
  ];

  function getRandomQuestions(n) {
    const shuffled = [...questionBank];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, n);
  }

  function renderQuiz() {
    if (currentIndex >= currentQuestions.length) {
      const message = `🎉 Has acertado ${score} de ${currentQuestions.length}. ${score > bestScore ? '¡NUEVO RÉCORD!' : ''}`;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('astroBestScore', bestScore);
      }
      quizArea.innerHTML = `
        <div class="score-area">${message}</div>
        <div>Mejor puntuación histórica: ${bestScore}/${currentQuestions.length}</div>
        <button id="newGameBtn" style="margin-top:1rem; background:#2c3e66; color:white; border:none; padding:0.6rem; border-radius:30px; width:100%;">🎮 Nueva partida</button>
        <button id="closeQuizAfter" style="margin-top:0.5rem; background:#ccc; border:none; padding:0.5rem; border-radius:30px;">Cerrar</button>
      `;
      document.getElementById('newGameBtn')?.addEventListener('click', startNewGame);
      document.getElementById('closeQuizAfter')?.addEventListener('click', () => quizModal.style.display = 'none');
      return;
    }
    const q = currentQuestions[currentIndex];
    let html = `<div class="quiz-question">${q.text}</div>`;
    q.options.forEach(opt => {
      html += `<button class="quiz-option" data-answer="${opt}">${opt}</button>`;
    });
    html += `<div class="score-area">Puntuación: ${score} / ${currentQuestions.length}</div>`;
    quizArea.innerHTML = html;
    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const selected = btn.getAttribute('data-answer');
        if (selected === q.correct) {
          score++;
          addTemporaryFeedback("✅ ¡Correcto!");
        } else {
          addTemporaryFeedback(`❌ Incorrecto. La respuesta era: ${q.correct}`);
        }
        currentIndex++;
        renderQuiz();
      });
    });
  }

  function addTemporaryFeedback(msg) {
    const feedback = document.createElement('div');
    feedback.textContent = msg;
    feedback.style.padding = '0.5rem';
    feedback.style.background = '#eef2f5';
    feedback.style.margin = '0.5rem 0';
    feedback.style.borderRadius = '20px';
    quizArea.appendChild(feedback);
    setTimeout(() => feedback.remove(), 1200);
  }

  function startNewGame() {
    currentQuestions = getRandomQuestions(5);
    currentIndex = 0;
    score = 0;
    renderQuiz();
  }

  document.getElementById('gameBtn').addEventListener('click', () => {
    if (!currentQuestions.length || currentIndex >= currentQuestions.length) startNewGame();
    quizModal.style.display = 'flex';
    renderQuiz();
  });
  document.getElementById('closeQuiz').addEventListener('click', () => quizModal.style.display = 'none');

  document.getElementById('emergencyBtn').addEventListener('click', () => window.location.href = 'https://www.google.com');
  sendBtn.addEventListener('click', () => { const msg = userInput.value.trim(); if (msg) { sendMessage(msg); userInput.value = ''; } });
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

  // Bienvenida
  setTimeout(() => {
    if (chatHistory.length === 0) {
      addMessage('bot', '🌌 ¡Hola, futura astronauta! Soy AstroChat, tu tutor espacial. Puedes preguntarme sobre estrellas, planetas, agujeros negros o usar el menú. ¿Por dónde empezamos?');
    }
  }, 500);

  // ADMIN: doble clic en el ícono de ajustes para cambiar la URL del Worker
  const adminModal = document.getElementById('adminModal');
  const adminWorkerUrlInput = document.getElementById('adminWorkerUrl');
  document.getElementById('adminArea').addEventListener('dblclick', () => {
    adminWorkerUrlInput.value = workerUrl;
    adminModal.style.display = 'block';
  });
  document.getElementById('saveAdminUrl').addEventListener('click', () => {
    const newUrl = adminWorkerUrlInput.value.trim();
    if (newUrl && newUrl.startsWith('https://') && newUrl.includes('.workers.dev')) {
      workerUrl = newUrl;
      localStorage.setItem('astroWorkerUrl', newUrl);
      addMessage('bot', `✅ URL del Worker actualizada a: ${newUrl}`);
      adminModal.style.display = 'none';
    } else {
      alert('URL inválida. Debe empezar con https:// y contener .workers.dev');
    }
  });
  document.getElementById('closeAdminModal').addEventListener('click', () => {
    adminModal.style.display = 'none';
  });
</script>
</body>
</html>
