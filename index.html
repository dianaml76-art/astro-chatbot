<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AstroChat · Tutor IA de Astronomía</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eef2f5;
      --primary: #2c3e66;
      --primary-light: #4a6fa5;
      --accent: #ffb347;
      --text: #1e2a3a;
      --border: #cbd7e4;
      --bubble-bot: #f0f4f9;
      --bubble-user: #2c3e66;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 1rem; text-align: center; border-radius: 0 0 24px 24px; }
    .header h1 { font-size: 1.5rem; }
    .chat-container { max-width: 900px; margin: 0.5rem auto; padding: 0 1rem; }
    .messages { display: flex; flex-direction: column; gap: 0.8rem; max-height: 55vh; overflow-y: auto; padding: 0.5rem 0.2rem; }
    .message { max-width: 85%; padding: 0.7rem 1rem; border-radius: 20px; line-height: 1.4; word-break: break-word; }
    .bot { background: white; border-left: 4px solid var(--primary-light); align-self: flex-start; }
    .user { background: var(--primary); color: white; align-self: flex-end; border-radius: 20px 20px 4px 20px; }
    .timestamp { font-size: 0.6rem; opacity: 0.7; margin-top: 0.3rem; text-align: right; }
    .typing { display: flex; align-items: center; gap: 6px; padding: 0.5rem 1rem; background: white; border-radius: 30px; width: fit-content; }
    .dot { width: 8px; height: 8px; background: var(--primary-light); border-radius: 50%; animation: bounce 1.4s infinite; display: inline-block; }
    @keyframes bounce { 0%,80%,100%{ transform: scale(0); } 40%{ transform: scale(1); } }
    .input-area { max-width: 900px; margin: 0 auto; padding: 0.5rem 1rem; display: flex; gap: 0.5rem; position: sticky; bottom: 70px; background: var(--bg); }
    .input-area input { flex: 1; padding: 0.7rem 1rem; border-radius: 60px; border: 1px solid var(--border); background: white; font-size: 0.9rem; }
    .input-area button { background: var(--primary); border: none; width: 44px; border-radius: 60px; color: white; font-size: 1.2rem; cursor: pointer; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.5rem auto; max-width: 900px; padding: 0 1rem; }
    .suggestion-btn { background: #ffffffcc; border: 1px solid var(--border); border-radius: 40px; padding: 0.3rem 0.7rem; font-size: 0.7rem; cursor: pointer; }
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      z-index: 100;
      display: flex;
      justify-content: space-evenly;
      padding: 0.3rem;
      flex-wrap: wrap;
      gap: 0.2rem;
    }
    .menu-item {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 40px;
      cursor: pointer;
      min-width: 55px;
    }
    .menu-item:hover { background: var(--border); }
    .emergency-btn {
      position: fixed;
      bottom: 85px;
      right: 12px;
      background: #e07a6a;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 6px 12px;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      z-index: 200;
    }
    .modal {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      max-width: 500px;
      width: 90%;
      border-radius: 24px;
      padding: 1.2rem;
      max-height: 80vh;
      overflow-y: auto;
    }
    .quiz-question { font-size: 1.1rem; font-weight: bold; margin: 1rem 0; }
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 0.6rem 1rem;
      margin: 0.5rem 0;
      cursor: pointer;
      transition: 0.2s;
    }
    .quiz-option:hover { background: var(--primary-light); color: white; }
    footer { text-align: center; font-size: 0.65rem; padding: 0.8rem; color: #6c757d; }
    @media (max-width: 600px) {
      .message { max-width: 95%; font-size: 0.85rem; }
      .menu-item { font-size: 0.55rem; min-width: 50px; padding: 4px 6px; }
      .suggestion-btn { font-size: 0.65rem; }
      .quiz-option { padding: 0.5rem 0.8rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>🚀 AstroChat</h1>
  <p>Tutor IA de Astronomía · Aprende explorando</p>
</div>

<div class="chat-container">
  <div id="messages" class="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Pregunta sobre estrellas, planetas..." autocomplete="off">
    <button id="sendBtn">📨</button>
  </div>
</div>

<div class="bottom-menu">
  <button class="menu-item" id="gameBtn">🎮<span>Juego</span></button>
  <button class="menu-item" id="summaryBtn">📄<span>Resumen</span></button>
  <button class="menu-item" id="exportChatBtn">📎<span>Exportar chat</span></button>
  <button class="menu-item" id="clearHistoryBtn">🗑️<span>Limpiar chat</span></button>
</div>

<button class="emergency-btn" id="emergencyBtn">🚨 Salir rápido</button>

<div id="quizModal" class="modal">
  <div class="modal-content">
    <h2>🔭 Quiz Astronómico</h2>
    <div id="quizArea"></div>
    <button id="closeQuiz" style="margin-top:1rem; background:#ccc; border:none; padding:0.5rem; border-radius:20px;">Cerrar</button>
  </div>
</div>

<footer>🔭 Respuestas por IA (Groq 70B) · Herramientas gratuitas</footer>

<script>
  // ============================================================
  // URL del Worker (ya configurada)
  // ============================================================
  const WORKER_URL = 'https://astro-groq-worker.dianaml76.workers.dev/';
  let workerUrl = WORKER_URL;

  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let chatHistory = [];

  const SYSTEM_PROMPT_ASTRO = `Eres un tutor experto de astronomía para estudiantes de 12 a 18 años. Hablas español claro, divertido, con analogías sencillas. Respuestas cortas (máximo 3 párrafos) a menos que se pida resumen extenso. Usa emojis espaciales: 🌟🌍🪐🔭🚀. Puedes usar **negritas** y listas. Cuando el estudiante pida un test, genera 5 preguntas de opción múltiple con su respuesta correcta al final.`;

  function clearChatCompletely() {
    chatHistory = [];
    messagesDiv.innerHTML = '';
    localStorage.removeItem('astroChatHistory');
    addMessage('bot', '🌌 ¡Hola, futura astronauta! Soy AstroChat, tu tutor espacial. Puedes preguntarme sobre astronomía, pedirme un test, resúmenes, o usar los botones del menú. ¿Por dónde empezamos?');
  }

  function addMessage(role, text, rawMarkdown = true) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    let content = text;
    if (role === 'bot' && rawMarkdown) {
      content = text.replace(/\n/g, '<br>');
      content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      content = content.replace(/\*(.*?)\*/g, '<em>$1</em>');
    }
    div.innerHTML = `${content}<div class="timestamp">${time}</div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    if (role === 'user') chatHistory.push({ role: 'user', content: text });
    else if (role === 'bot') chatHistory.push({ role: 'assistant', content: text });
  }

  let typingDiv = null;
  function showTyping(show, text = "Pensando...") {
    if (show && !typingDiv) {
      typingDiv = document.createElement('div');
      typingDiv.className = 'typing';
      typingDiv.innerHTML = `<span>${text}</span><div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else if (!show && typingDiv) {
      typingDiv.remove();
      typingDiv = null;
    }
  }

  async function askGroq(userMessage, isResumen = false) {
    if (!workerUrl) {
      addMessage('bot', '⚠️ Error: URL del Worker no configurada. Contacta al administrador.');
      return null;
    }
    let messagesToSend = isResumen ? [{ role: 'user', content: userMessage }] : chatHistory.concat({ role: 'user', content: userMessage });
    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesToSend, systemPrompt: SYSTEM_PROMPT_ASTRO })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.reply;
    } catch (error) {
      console.error(error);
      addMessage('bot', '🔌 Error de conexión. El servicio no está disponible temporalmente.');
      return null;
    }
  }

  // Función mejorada para generar PDF profesional
  function generatePDF(title, content) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 20; // márgenes laterales superior e inferior
    let y = margin + 10; // posición Y inicial después del título

    // Configurar fuentes y colores
    doc.setFont('helvetica');
    
    // --- Título con icono y color azul ---
    doc.setFontSize(22);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(44, 62, 102); // azul oscuro #2c3e66
    doc.text(`🚀 ${title}`, margin, y);
    y += 10;
    
    // Línea decorativa debajo del título
    doc.setDrawColor(74, 111, 165); // azul medio
    doc.setLineWidth(0.5);
    doc.line(margin, y, pageWidth - margin, y);
    y += 8;
    
    // --- Contenido: texto en gris oscuro, tamaño 11, normal ---
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(51, 51, 51); // gris oscuro #333333
    
    // Limpiar el contenido: eliminar etiquetas HTML y caracteres especiales
    let cleanText = content.replace(/<[^>]*>/g, '')      // eliminar HTML
                           .replace(/&nbsp;/g, ' ')
                           .replace(/[\u0000-\u001F\u007F-\u009F]/g, '')
                           .replace(/\s+/g, ' ')
                           .trim();
    
    // Dividir el texto en líneas respetando el ancho de página (márgenes)
    const maxWidth = pageWidth - margin * 2;
    const lines = doc.splitTextToSize(cleanText, maxWidth);
    
    // Escribir línea por línea con control de salto de página
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      // Si la línea actual sobrepasa la página, crear nueva página
      if (y + 7 > pageHeight - margin) {
        doc.addPage();
        y = margin + 5;
        // Restablecer color y fuente en nueva página
        doc.setFontSize(11);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(51, 51, 51);
      }
      doc.text(line, margin, y);
      y += 7; // interlineado
    }
    
    // --- Pie de página (nombre del chatbot y fecha) ---
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'italic');
      doc.setTextColor(100, 100, 100);
      const footerText = `AstroChat - Resumen generado el ${new Date().toLocaleDateString()}`;
      doc.text(footerText, margin, pageHeight - 10);
      // Número de página
      doc.text(`Página ${i} de ${pageCount}`, pageWidth - margin - 20, pageHeight - 10);
    }
    
    // Guardar PDF
    doc.save(`resumen_${title.replace(/ /g, '_')}.pdf`);
  }

  async function sendMessage(message, skipAddUser = false) {
    if (!message.trim()) return;
    if (!skipAddUser) addMessage('user', message);
    
    const esResumen = /resumen descargable|resumen en pdf|genera un resumen|resumen de/i.test(message);
    showTyping(true, esResumen ? "Generando resumen..." : "Consultando a la IA...");
    let reply;
    if (esResumen) {
      let tema = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim();
      if (!tema) tema = "astronomía";
      const promptResumen = `Genera un resumen extenso sobre "${tema}" de al menos 400 palabras, para estudiantes de 12 a 18 años. Incluye título, introducción, puntos clave y conclusión. Usa párrafos claros. No uses lenguaje técnico complejo.`;
      reply = await askGroq(promptResumen, true);
    } else {
      reply = await askGroq(message);
    }
    showTyping(false);
    if (reply) {
      addMessage('bot', reply);
      if (esResumen) {
        const lastMsg = messagesDiv.lastChild;
        const btn = document.createElement('button');
        btn.textContent = '📥 Descargar PDF (versión mejorada)';
        btn.style.cssText = 'margin-top:8px; padding:4px 10px; border-radius:20px; border:none; background:#4a6fa5; color:white; cursor:pointer; font-size:0.75rem;';
        const temaPDF = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim() || "Astronomía";
        btn.onclick = () => generatePDF(temaPDF, reply);
        lastMsg.appendChild(btn);
      }
    } else {
      addMessage('bot', 'No se pudo obtener respuesta. Inténtalo de nuevo más tarde.');
    }
  }

  function exportChatToPDF() {
    if (chatHistory.length === 0) {
      addMessage('bot', 'No hay conversación para exportar.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const margin = 20;
    let y = margin + 10;
    doc.setFont('helvetica');
    doc.setFontSize(18);
    doc.setTextColor(44, 62, 102);
    doc.text('Conversación con AstroChat', margin, y);
    y += 10;
    doc.setDrawColor(74, 111, 165);
    doc.line(margin, y, doc.internal.pageSize.getWidth() - margin, y);
    y += 8;
    doc.setFontSize(10);
    doc.setTextColor(51, 51, 51);
    for (let msg of chatHistory) {
      const prefix = msg.role === 'user' ? '👤 Tú: ' : '🤖 AstroChat: ';
      let text = prefix + msg.content.replace(/<[^>]*>/g, '');
      const lines = doc.splitTextToSize(text, doc.internal.pageSize.getWidth() - margin * 2);
      for (let line of lines) {
        if (y + 6 > doc.internal.pageSize.getHeight() - margin) {
          doc.addPage();
          y = margin + 5;
        }
        doc.text(line, margin, y);
        y += 6;
      }
      y += 2;
    }
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text(`AstroChat - ${new Date().toLocaleDateString()}`, margin, doc.internal.pageSize.getHeight() - 10);
      doc.text(`Página ${i} de ${pageCount}`, doc.internal.pageSize.getWidth() - margin - 20, doc.internal.pageSize.getHeight() - 10);
    }
    doc.save('conversacion_astrochat.pdf');
  }

  function clearChat() {
    if (confirm("¿Borrar toda la conversación actual?")) {
      clearChatCompletely();
    }
  }

  // ===================== QUIZ INTERACTIVO =====================
  const quizModal = document.getElementById('quizModal');
  const quizArea = document.getElementById('quizArea');
  let currentQuestions = [], currentIndex = 0, score = 0, userAnswers = [];
  let bestScore = localStorage.getItem('astroBestScore') || 0;

  const questionBank = [
    { text: "¿Cuál es el planeta más grande del Sistema Solar?", options: ["Marte", "Júpiter", "Saturno", "Neptuno"], correct: "Júpiter" },
    { text: "¿Qué estrella es el centro de nuestro sistema planetario?", options: ["Sirio", "Próxima Centauri", "El Sol", "Vega"], correct: "El Sol" },
    { text: "¿Qué galaxia es la vecina más cercana a la Vía Láctea?", options: ["Andrómeda", "Triángulo", "Remolino", "Ojo de Cerradura"], correct: "Andrómeda" },
    { text: "¿Qué es un agujero negro?", options: ["Una estrella muerta", "Una región con gravedad extrema que ni la luz escapa", "Un planeta oscuro", "Una nube de gas"], correct: "Una región con gravedad extrema que ni la luz escapa" },
    { text: "¿Cuál es la temperatura aproximada de la superficie del Sol?", options: ["5,500 °C", "15 millones °C", "1,000 °C", "100 °C"], correct: "5,500 °C" },
    { text: "¿Qué telescopio espacial nos ha dado imágenes increíbles del universo desde 1990?", options: ["Hubble", "James Webb", "Spitzer", "Kepler"], correct: "Hubble" },
    { text: "¿Cuántos planetas tiene el Sistema Solar (sin Plutón)?", options: ["7", "8", "9", "10"], correct: "8" },
    { text: "¿Qué misión puso el primer humano en la Luna?", options: ["Apolo 11", "Artemis 1", "Gemini 4", "Sputnik"], correct: "Apolo 11" },
    { text: "¿Qué es una supernova?", options: ["Una estrella que explota al final de su vida", "Un cometa gigante", "Una luna nueva", "Un agujero de gusano"], correct: "Una estrella que explota al final de su vida" },
    { text: "¿Cuál es el planeta conocido como el 'gigante gaseoso' de color azul verdoso?", options: ["Urano", "Júpiter", "Saturno", "Neptuno"], correct: "Neptuno" },
    { text: "¿Qué fenómeno ocurre cuando la Luna se interpone entre el Sol y la Tierra?", options: ["Eclipse solar", "Eclipse lunar", "Marea alta", "Aurora boreal"], correct: "Eclipse solar" },
    { text: "¿Qué objeto del cielo profundo es famoso por sus anillos visibles?", options: ["Nebulosa de Orión", "Galaxia del Sombrero", "Saturno", "Cúmulo de las Pléyades"], correct: "Saturno" },
    { text: "¿Qué nombre recibe la estrella más cercana al Sol?", options: ["Próxima Centauri", "Alfa Centauri", "Barnard", "Sirio"], correct: "Próxima Centauri" },
    { text: "¿Qué misión actual estudia el subsuelo de Marte?", options: ["Perseverance", "Curiosity", "InSight", "Mars Express"], correct: "InSight" },
    { text: "¿Cuál es el planeta más caliente del Sistema Solar (por su densa atmósfera)?", options: ["Mercurio", "Venus", "Marte", "Júpiter"], correct: "Venus" },
    { text: "¿Cuánto dura un día en Venus (rotación)?", options: ["243 días terrestres", "24 horas", "365 días", "687 días"], correct: "243 días terrestres" },
    { text: "¿Qué misión llevó el rover Perseverance a Marte?", options: ["Mars 2020", "ExoMars", "Curiosity", "Opportunity"], correct: "Mars 2020" },
    { text: "¿Cuál es la luna más grande de Júpiter?", options: ["Ganímedes", "Europa", "Ío", "Calisto"], correct: "Ganímedes" },
    { text: "¿Qué estrella explotará como supernova en los próximos miles de años (visible desde la Tierra)?", options: ["Betelgeuse", "Sirio", "Polaris", "Alpha Centauri"], correct: "Betelgeuse" },
    { text: "¿Qué telescopio espacial sucede al Hubble?", options: ["James Webb", "Spitzer", "Kepler", "Chandra"], correct: "James Webb" }
  ];

  function getRandomQuestions(n) {
    const shuffled = [...questionBank];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, n);
  }

  function renderQuiz() {
    if (currentIndex >= currentQuestions.length) {
      let resultHtml = `<div class="score-area">🎉 Has acertado ${score} de ${currentQuestions.length}.</div>`;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('astroBestScore', bestScore);
        resultHtml += `<div>🏆 ¡NUEVO RÉCORD! Mejor puntuación: ${bestScore}/${currentQuestions.length}</div>`;
      } else {
        resultHtml += `<div>🏆 Mejor puntuación histórica: ${bestScore}/${currentQuestions.length}</div>`;
      }
      resultHtml += `<div style="margin-top:1rem;"><strong>📝 Respuestas correctas:</strong><ul>`;
      for (let i = 0; i < currentQuestions.length; i++) {
        const q = currentQuestions[i];
        const userAnswer = userAnswers[i] || "No respondida";
        resultHtml += `<li><strong>${q.text}</strong><br>Tu respuesta: ${userAnswer}<br>✅ Respuesta correcta: ${q.correct}</li>`;
      }
      resultHtml += `</ul></div><button id="newGameBtn" style="margin-top:1rem; background:#2c3e66; color:white; border:none; padding:0.6rem; border-radius:30px; width:100%;">🎮 Nueva partida</button>`;
      quizArea.innerHTML = resultHtml;
      document.getElementById('newGameBtn')?.addEventListener('click', startNewGame);
      return;
    }
    const q = currentQuestions[currentIndex];
    let html = `<div class="quiz-question">${q.text}</div>`;
    q.options.forEach(opt => {
      html += `<button class="quiz-option" data-answer="${opt}">${opt}</button>`;
    });
    html += `<div class="score-area">📊 Puntuación: ${score} / ${currentQuestions.length}</div>`;
    quizArea.innerHTML = html;
    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.onclick = () => {
        const selected = btn.getAttribute('data-answer');
        userAnswers[currentIndex] = selected;
        if (selected === q.correct) {
          score++;
          addTemporaryFeedback("✅ ¡Correcto!");
        } else {
          addTemporaryFeedback(`❌ Incorrecto. La respuesta correcta es: ${q.correct}`);
        }
        currentIndex++;
        renderQuiz();
      };
    });
  }

  function addTemporaryFeedback(msg) {
    const feedback = document.createElement('div');
    feedback.textContent = msg;
    feedback.style.padding = '0.5rem';
    feedback.style.background = '#eef2f5';
    feedback.style.margin = '0.5rem 0';
    feedback.style.borderRadius = '20px';
    quizArea.appendChild(feedback);
    setTimeout(() => feedback.remove(), 1500);
  }

  function startNewGame() {
    currentQuestions = getRandomQuestions(5);
    currentIndex = 0;
    score = 0;
    userAnswers = [];
    renderQuiz();
  }

  // ===================== EVENTOS =====================
  sendBtn.onclick = () => { const msg = userInput.value.trim(); if(msg) { sendMessage(msg); userInput.value = ''; } };
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
  document.getElementById('summaryBtn').onclick = () => { const t = prompt('¿Tema del resumen?'); if(t) sendMessage(`Haz un resumen descargable de ${t}`); };
  document.getElementById('gameBtn').onclick = () => { if (!currentQuestions.length || currentIndex >= currentQuestions.length) startNewGame(); quizModal.style.display = 'flex'; renderQuiz(); };
  document.getElementById('closeQuiz').onclick = () => quizModal.style.display = 'none';
  document.getElementById('exportChatBtn').onclick = () => exportChatToPDF();
  document.getElementById('clearHistoryBtn').onclick = () => clearChat();
  document.getElementById('emergencyBtn').onclick = () => window.location.href = 'https://www.google.com';

  const suggestionsDiv = document.getElementById('suggestions');
  const quickQuestions = [
    '¿Qué es un agujero negro?',
    '¿Cómo se forma una estrella?',
    '¿Por qué Marte es rojo?',
    '¿Qué es la Vía Láctea?',
    '¿Cuánto dura un día en Venus?',
    'Hazme un test de estrellas'
  ];
  quickQuestions.forEach(q => {
    const btn = document.createElement('button');
    btn.textContent = q;
    btn.className = 'suggestion-btn';
    btn.onclick = () => sendMessage(q);
    suggestionsDiv.appendChild(btn);
  });

  clearChatCompletely();
</script>
</body>
</html>
