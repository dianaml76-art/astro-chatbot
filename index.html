<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AstroChat · Tutor IA de Astronomía</title>
  <!-- jsPDF para generar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #eef2f5;
      --surface: #ffffff;
      --primary: #2c3e66;
      --primary-light: #4a6fa5;
      --accent: #ffb347;
      --text: #1e2a3a;
      --text-light: #4a5b6e;
      --border: #cbd7e4;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --bubble-bot: #f0f4f9;
      --bubble-user: #2c3e66;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    /* Encabezado */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 1.2rem;
      text-align: center;
      border-radius: 0 0 32px 32px;
      box-shadow: var(--shadow);
    }
    .header h1 {
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .header p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 0.3rem;
    }

    /* Configuración worker */
    .config-bar {
      background: white;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .config-bar input {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 60px;
      width: 260px;
      font-size: 0.85rem;
    }
    .config-bar button {
      background: var(--primary-light);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    /* Área de chat */
    .chat-container {
      max-width: 800px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 50vh;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .message {
      max-width: 85%;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .bot {
      background: var(--bubble-bot);
      border-left: 4px solid var(--primary-light);
      align-self: flex-start;
    }
    .user {
      background: var(--bubble-user);
      color: white;
      align-self: flex-end;
      border-radius: 20px 20px 4px 20px;
    }
    .timestamp {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 0.4rem;
      text-align: right;
    }
    .typing {
      display: flex;
      gap: 6px;
      padding: 0.6rem 1rem;
      background: white;
      border-radius: 30px;
      width: fit-content;
      border-left: 3px solid var(--primary-light);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    @keyframes bounce {
      0%,80%,100%{ transform: scale(0); }
      40%{ transform: scale(1); }
    }

    /* Input */
    .input-area {
      max-width: 800px;
      margin: 0 auto;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      position: sticky;
      bottom: 70px;
      background: var(--bg);
    }
    .input-area input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 60px;
      font-size: 1rem;
      background: white;
    }
    .input-area button {
      background: var(--primary);
      border: none;
      width: 48px;
      border-radius: 60px;
      cursor: pointer;
      color: white;
    }

    /* Menú inferior */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem;
      border-top: 1px solid var(--border);
      z-index: 100;
      flex-wrap: wrap;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 40px;
      cursor: pointer;
      gap: 4px;
    }
    .menu-item:hover {
      background: var(--border);
    }
    .menu-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
    }

    /* Botón salir rápido */
    .emergency-btn {
      position: fixed;
      bottom: 90px;
      right: 16px;
      background: #e07a6a;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 200;
      box-shadow: var(--shadow);
    }

    /* Modal del juego */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      max-width: 500px;
      width: 90%;
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
      max-height: 80vh;
      overflow-y: auto;
    }
    .quiz-question {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 0.7rem 1rem;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    .quiz-option:hover {
      background: var(--primary-light);
      color: white;
    }
    .score-area {
      margin-top: 1rem;
      font-weight: bold;
    }

    footer {
      text-align: center;
      font-size: 0.7rem;
      padding: 1rem;
      color: #6c757d;
    }
    @media (max-width: 600px) {
      .message { max-width: 95%; }
      .bottom-menu span { font-size: 0.6rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🚀 AstroChat</h1>
  <p>Tutor IA de Astronomía · Para estudiantes curiosos</p>
</div>

<div class="config-bar">
  <input type="text" id="workerUrl" placeholder="URL de tu Cloudflare Worker (ej: https://tu-worker.workers.dev)" size="30">
  <button id="saveWorkerUrl">Guardar</button>
</div>

<div class="chat-container">
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Pregunta sobre estrellas, planetas, agujeros negros..." autocomplete="off">
    <button id="sendBtn">📨</button>
  </div>
</div>

<div class="bottom-menu">
  <button class="menu-item" data-topic="Sistema Solar">🌍<span>Sistema Solar</span></button>
  <button class="menu-item" data-topic="Estrellas">⭐<span>Estrellas</span></button>
  <button class="menu-item" data-topic="Galaxias">🌀<span>Galaxias</span></button>
  <button class="menu-item" data-topic="Agujeros negros">🕳️<span>Agujeros negros</span></button>
  <button class="menu-item" data-topic="Observación del cielo">🔭<span>Observar</span></button>
  <button class="menu-item" data-topic="Misiones espaciales">🚀<span>Misiones</span></button>
  <button class="menu-item" id="summaryBtn">📄<span>Resumen</span></button>
  <button class="menu-item" id="gameBtn">🎮<span>Juego</span></button>
</div>

<button class="emergency-btn" id="emergencyBtn">🚨 Salir rápido</button>

<!-- Modal del juego -->
<div id="quizModal" class="modal">
  <div class="modal-content">
    <h2>🔭 Quiz Astronómico</h2>
    <div id="quizArea"></div>
    <button id="closeQuiz" style="margin-top: 1rem; background:#ccc; border:none; padding:0.5rem; border-radius:20px;">Cerrar</button>
  </div>
</div>

<footer>🔭 Las respuestas son generadas por IA (Groq 70B). Aprende y diviértete.</footer>

<script>
  // -----------------------------------------
  // 1. Variables globales y configuración
  // -----------------------------------------
  let workerUrl = localStorage.getItem('astroWorkerUrl') || '';
  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const workerUrlInput = document.getElementById('workerUrl');
  const saveWorkerUrlBtn = document.getElementById('saveWorkerUrl');
  
  let chatHistory = [];  // para mantener contexto (role: user/assistant)
  let currentSummaryText = ''; // para PDF

  // Inicializar campo worker URL
  if (workerUrl) workerUrlInput.value = workerUrl;
  
  // Guardar URL del worker
  saveWorkerUrlBtn.addEventListener('click', () => {
    const url = workerUrlInput.value.trim();
    if (url) {
      workerUrl = url;
      localStorage.setItem('astroWorkerUrl', url);
      addMessage('bot', '✅ URL del Worker guardada. ¡Ya puedes hacer preguntas de astronomía!');
    } else {
      alert('Ingresa una URL válida de Cloudflare Worker');
    }
  });

  // Función para agregar mensajes al chat
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = `${text}<div class="timestamp">${time}</div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    // Guardar en historial (solo para contexto, no el timestamp)
    if (role === 'user') {
      chatHistory.push({ role: 'user', content: text });
    } else if (role === 'bot') {
      chatHistory.push({ role: 'assistant', content: text });
    }
    // Mantener solo últimos 10 pares para no saturar tokens
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
  }

  // Indicador "escribiendo"
  let typingDiv = null;
  function showTyping(show) {
    if (show && !typingDiv) {
      typingDiv = document.createElement('div');
      typingDiv.className = 'typing';
      typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else if (!show && typingDiv) {
      typingDiv.remove();
      typingDiv = null;
    }
  }

  // Llamada al Worker
  async function askGroq(userMessage) {
    if (!workerUrl) {
      addMessage('bot', '⚠️ Primero configura la URL de tu Worker en el campo superior.');
      return null;
    }
    // Preparar mensajes: incluir historial reciente (sin system, el worker ya lo tiene)
    const messagesToSend = chatHistory.concat({ role: 'user', content: userMessage });
    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesToSend })
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || `HTTP ${response.status}`);
      }
      const data = await response.json();
      return data.reply;
    } catch (error) {
      console.error(error);
      addMessage('bot', '🔌 Error de conexión con el tutor IA. ¿Revisaste que el Worker esté activo y la URL correcta?');
      return null;
    }
  }

  // Enviar mensaje
  async function sendMessage(message, skipAddUser = false) {
    if (!message.trim()) return;
    if (!skipAddUser) addMessage('user', message);
    showTyping(true);
    const reply = await askGroq(message);
    showTyping(false);
    if (reply) {
      addMessage('bot', reply);
    } else {
      addMessage('bot', 'Lo siento, no pude obtener respuesta. Verifica tu Worker.');
    }
  }

  // Manejador de envío
  sendBtn.addEventListener('click', () => {
    const msg = userInput.value.trim();
    if (msg) {
      sendMessage(msg);
      userInput.value = '';
    }
  });
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

  // Temas del menú
  document.querySelectorAll('.menu-item[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      const topic = btn.getAttribute('data-topic');
      sendMessage(`Explícame sobre ${topic} de forma divertida y sencilla para un estudiante de secundaria.`);
    });
  });

  // Resumen para PDF
  document.getElementById('summaryBtn').addEventListener('click', async () => {
    const topic = prompt('¿De qué tema astronómico quieres un resumen de una hoja? (ej: agujeros negros, Marte, telescopios)');
    if (!topic) return;
    addMessage('user', `Quiero un resumen de "${topic}" para descargar como PDF, máximo una hoja A4.`);
    showTyping(true);
    const reply = await askGroq(`Genera un resumen educativo sobre "${topic}" de máximo 500 palabras, adecuado para estudiantes de 12 a 18 años. Incluye título, puntos clave y conclusión. No uses lenguaje técnico complejo.`);
    showTyping(false);
    if (reply) {
      currentSummaryText = reply;
      addMessage('bot', reply + '\n\n📎 **Resumen generado. Haz clic en "Descargar PDF" para guardarlo.**');
      // Agregar botón de descarga dentro del último mensaje (mejor que flotante)
      const lastMsg = messagesDiv.lastChild;
      const downloadBtn = document.createElement('button');
      downloadBtn.textContent = '📥 Descargar PDF';
      downloadBtn.style.marginTop = '10px';
      downloadBtn.style.padding = '6px 12px';
      downloadBtn.style.borderRadius = '20px';
      downloadBtn.style.border = 'none';
      downloadBtn.style.background = '#4a6fa5';
      downloadBtn.style.color = 'white';
      downloadBtn.style.cursor = 'pointer';
      downloadBtn.onclick = () => generatePDF(topic, currentSummaryText);
      lastMsg.appendChild(downloadBtn);
    }
  });

  function generatePDF(title, content) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica');
    doc.setFontSize(18);
    doc.text(`Resumen: ${title}`, 20, 20);
    doc.setFontSize(12);
    const splitText = doc.splitTextToSize(content, 170);
    doc.text(splitText, 20, 35);
    doc.save(`resumen_${title.replace(/ /g,'_')}.pdf`);
  }

  // -----------------------------------------
  // JUEGO INTERACTIVO (quiz)
  // -----------------------------------------
  const quizModal = document.getElementById('quizModal');
  const quizArea = document.getElementById('quizArea');
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let bestScore = localStorage.getItem('astroBestScore') || 0;

  // Banco de preguntas (al menos 15)
  const questionBank = [
    { text: "¿Cuál es el planeta más grande del Sistema Solar?", options: ["Marte", "Júpiter", "Saturno", "Neptuno"], correct: "Júpiter" },
    { text: "¿Qué estrella es el centro de nuestro sistema planetario?", options: ["Sirio", "Próxima Centauri", "El Sol", "Vega"], correct: "El Sol" },
    { text: "¿Qué galaxia es la vecina más cercana a la Vía Láctea?", options: ["Andrómeda", "Triángulo", "Remolino", "Ojo de Cerradura"], correct: "Andrómeda" },
    { text: "¿Qué es un agujero negro?", options: ["Una estrella muerta", "Una región con gravedad extrema que ni la luz escapa", "Un planeta oscuro", "Una nube de gas"], correct: "Una región con gravedad extrema que ni la luz escapa" },
    { text: "¿Cuál es la temperatura aproximada de la superficie del Sol?", options: ["5,500 °C", "15 millones °C", "1,000 °C", "100 °C"], correct: "5,500 °C" },
    { text: "¿Qué telescopio espacial nos ha dado imágenes increíbles del universo desde 1990?", options: ["Hubble", "James Webb", "Spitzer", "Kepler"], correct: "Hubble" },
    { text: "¿Cuántos planetas tiene el Sistema Solar (sin contar Plutón como planeta)?", options: ["7", "8", "9", "10"], correct: "8" },
    { text: "¿Qué misión puso el primer humano en la Luna?", options: ["Apolo 11", "Artemis 1", "Gemini 4", "Sputnik"], correct: "Apolo 11" },
    { text: "¿Qué es una supernova?", options: ["Una estrella que explota al final de su vida", "Un cometa gigante", "Una luna nueva", "Un agujero de gusano"], correct: "Una estrella que explota al final de su vida" },
    { text: "¿Cuál es el planeta conocido como el 'gigante gaseoso' de color azul verdoso?", options: ["Urano", "Júpiter", "Saturno", "Neptuno"], correct: "Neptuno" },
    { text: "¿Qué fenómeno ocurre cuando la Luna se interpone entre el Sol y la Tierra?", options: ["Eclipse solar", "Eclipse lunar", "Marea alta", "Aurora boreal"], correct: "Eclipse solar" },
    { text: "¿Qué objeto del cielo profundo es famoso por sus anillos visibles?", options: ["Nebulosa de Orión", "Galaxia del Sombrero", "Saturno", "Cúmulo de las Pléyades"], correct: "Saturno" },
    { text: "¿Qué nombre recibe la estrella más cercana al Sol?", options: ["Próxima Centauri", "Alfa Centauri", "Barnard", "Sirio"], correct: "Próxima Centauri" },
    { text: "¿Qué misión actual estudia el subsuelo de Marte?", options: ["Perseverance", "Curiosity", "InSight", "Mars Express"], correct: "InSight" },
    { text: "¿Cuál es el planeta más caliente del Sistema Solar (por su densa atmósfera)?", options: ["Mercurio", "Venus", "Marte", "Júpiter"], correct: "Venus" }
  ];

  function getRandomQuestions(n) {
    const shuffled = [...questionBank];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, n);
  }

  function renderQuiz() {
    if (currentIndex >= currentQuestions.length) {
      // Fin del juego
      const message = `🎉 Has acertado ${score} de ${currentQuestions.length}. ${score > bestScore ? '¡NUEVO RÉCORD!' : ''}`;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('astroBestScore', bestScore);
      }
      quizArea.innerHTML = `
        <div class="score-area">${message}</div>
        <div>Mejor puntuación histórica: ${bestScore}/${currentQuestions.length}</div>
        <button id="newGameBtn" style="margin-top:1rem; background:#2c3e66; color:white; border:none; padding:0.6rem; border-radius:30px; width:100%;">🎮 Nueva partida</button>
        <button id="closeQuizAfter" style="margin-top:0.5rem; background:#ccc; border:none; padding:0.5rem; border-radius:30px;">Cerrar</button>
      `;
      document.getElementById('newGameBtn')?.addEventListener('click', () => {
        startNewGame();
      });
      document.getElementById('closeQuizAfter')?.addEventListener('click', () => {
        quizModal.style.display = 'none';
      });
      return;
    }
    const q = currentQuestions[currentIndex];
    let html = `<div class="quiz-question">${q.text}</div>`;
    q.options.forEach(opt => {
      html += `<button class="quiz-option" data-answer="${opt}">${opt}</button>`;
    });
    html += `<div class="score-area">Puntuación: ${score} / ${currentQuestions.length}</div>`;
    quizArea.innerHTML = html;
    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const selected = btn.getAttribute('data-answer');
        if (selected === q.correct) {
          score++;
          addTemporaryFeedback("✅ ¡Correcto!");
        } else {
          addTemporaryFeedback(`❌ Incorrecto. La respuesta era: ${q.correct}`);
        }
        currentIndex++;
        renderQuiz();
      });
    });
  }

  function addTemporaryFeedback(msg) {
    const feedback = document.createElement('div');
    feedback.textContent = msg;
    feedback.style.padding = '0.5rem';
    feedback.style.background = '#eef2f5';
    feedback.style.margin = '0.5rem 0';
    feedback.style.borderRadius = '20px';
    quizArea.appendChild(feedback);
    setTimeout(() => feedback.remove(), 1200);
  }

  function startNewGame() {
    currentQuestions = getRandomQuestions(5);
    currentIndex = 0;
    score = 0;
    renderQuiz();
  }

  document.getElementById('gameBtn').addEventListener('click', () => {
    if (!currentQuestions.length || currentIndex >= currentQuestions.length) {
      startNewGame();
    }
    quizModal.style.display = 'flex';
    renderQuiz();
  });
  document.getElementById('closeQuiz').addEventListener('click', () => {
    quizModal.style.display = 'none';
  });

  // Salir rápido
  document.getElementById('emergencyBtn').addEventListener('click', () => {
    window.location.href = 'https://www.google.com';
  });

  // Mensaje de bienvenida
  setTimeout(() => {
    if (chatHistory.length === 0) {
      addMessage('bot', '🌌 ¡Hola, futura astronauta! Soy AstroChat, tu tutor espacial. Puedes preguntarme sobre estrellas, planetas, agujeros negros o usar el menú. ¿Por dónde empezamos?');
    }
  }, 500);

  // Service Worker para offline básico (cache de archivos)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW fallido:', err));
  }
</script>

<script>
  // Service Worker inline? No, mejor creamos un sw.js aparte. Pero lo incluimos como blob para que funcione en un solo archivo.
  // Para simplificar y que el usuario no requiera otro archivo, haremos un service worker virtual usando blob? 
  // En producción real es mejor tener sw.js aparte. Como el usuario tiene GitHub puede crearlo. Voy a generar el código del sw separado.
  // Pero en este index.html añado un script que registra un worker desde un blob solo para demostración (no persistirá tras recarga). 
  // Para una solución real, recomiendo crear un archivo sw.js aparte. Sin embargo lo incluyo en comentarios.
  console.log("Para funcionamiento offline real, crea un archivo sw.js en el mismo directorio con el contenido de caché básico.");
</script>

</body>
</html>
