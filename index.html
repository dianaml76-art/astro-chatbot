<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AstroChat · Tutor IA de Astronomía</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eef2f5;
      --primary: #2c3e66;
      --primary-light: #4a6fa5;
      --accent: #ffb347;
      --text: #1e2a3a;
      --border: #cbd7e4;
      --bubble-bot: #f0f4f9;
      --bubble-user: #2c3e66;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 1rem; text-align: center; border-radius: 0 0 24px 24px; }
    .header h1 { font-size: 1.5rem; }
    .chat-container { max-width: 900px; margin: 0.5rem auto; padding: 0 1rem; }
    .messages { display: flex; flex-direction: column; gap: 0.8rem; max-height: 55vh; overflow-y: auto; padding: 0.5rem 0.2rem; }
    .message { max-width: 85%; padding: 0.7rem 1rem; border-radius: 20px; line-height: 1.4; word-break: break-word; }
    .bot { background: white; border-left: 4px solid var(--primary-light); align-self: flex-start; }
    .user { background: var(--primary); color: white; align-self: flex-end; border-radius: 20px 20px 4px 20px; }
    .timestamp { font-size: 0.6rem; opacity: 0.7; margin-top: 0.3rem; text-align: right; }
    .typing { display: flex; align-items: center; gap: 6px; padding: 0.5rem 1rem; background: white; border-radius: 30px; width: fit-content; }
    .dot { width: 8px; height: 8px; background: var(--primary-light); border-radius: 50%; animation: bounce 1.4s infinite; display: inline-block; }
    @keyframes bounce { 0%,80%,100%{ transform: scale(0); } 40%{ transform: scale(1); } }
    .input-area { max-width: 900px; margin: 0 auto; padding: 0.5rem 1rem; display: flex; gap: 0.5rem; position: sticky; bottom: 70px; background: var(--bg); }
    .input-area input { flex: 1; padding: 0.7rem 1rem; border-radius: 60px; border: 1px solid var(--border); background: white; font-size: 0.9rem; }
    .input-area button { background: var(--primary); border: none; width: 44px; border-radius: 60px; color: white; font-size: 1.2rem; cursor: pointer; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.5rem auto; max-width: 900px; padding: 0 1rem; }
    .suggestion-btn { background: #ffffffcc; border: 1px solid var(--border); border-radius: 40px; padding: 0.3rem 0.7rem; font-size: 0.7rem; cursor: pointer; }
    .bottom-menu { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); display: flex; justify-content: space-evenly; padding: 0.3rem; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 0.2rem; z-index: 100; }
    .menu-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; font-size: 0.6rem; font-weight: 500; padding: 4px 6px; border-radius: 40px; cursor: pointer; min-width: 50px; }
    .emergency-btn { position: fixed; bottom: 85px; right: 12px; background: #e07a6a; color: white; border: none; border-radius: 50px; padding: 6px 12px; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer; z-index: 200; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; max-width: 500px; width: 90%; border-radius: 24px; padding: 1.2rem; max-height: 80vh; overflow-y: auto; }
    .quiz-question { font-size: 1.1rem; font-weight: bold; margin: 1rem 0; }
    .quiz-option { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--border); border-radius: 60px; padding: 0.6rem 1rem; margin: 0.5rem 0; cursor: pointer; }
    footer { text-align: center; font-size: 0.65rem; padding: 0.8rem; color: #6c757d; }
    @media (max-width: 600px) {
      .message { max-width: 95%; font-size: 0.85rem; }
      .menu-item { font-size: 0.55rem; min-width: 45px; }
      .suggestion-btn { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>🚀 AstroChat</h1>
  <p>Tutor IA de Astronomía · Aprende explorando</p>
</div>

<div class="chat-container">
  <div id="messages" class="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Pregunta sobre estrellas, planetas..." autocomplete="off">
    <button id="sendBtn">📨</button>
  </div>
</div>

<div class="bottom-menu">
  <button class="menu-item" data-topic="Sistema Solar">🌍<span>Solar</span></button>
  <button class="menu-item" data-topic="Estrellas">⭐<span>Estrellas</span></button>
  <button class="menu-item" data-topic="Galaxias">🌀<span>Galaxias</span></button>
  <button class="menu-item" data-topic="Agujeros negros">🕳️<span>Agujeros negros</span></button>
  <button class="menu-item" data-topic="Observación del cielo">🔭<span>Observar</span></button>
  <button class="menu-item" data-topic="Misiones espaciales">🚀<span>Misiones</span></button>
  <button class="menu-item" id="summaryBtn">📄<span>Resumen</span></button>
  <button class="menu-item" id="gameBtn">🎮<span>Juego</span></button>
  <button class="menu-item" id="exportChatBtn">📎<span>Exportar</span></button>
  <button class="menu-item" id="clearHistoryBtn">🗑️<span>Limpiar</span></button>
</div>
<button class="emergency-btn" id="emergencyBtn">🚨 Salir rápido</button>

<!-- Modal quiz -->
<div id="quizModal" class="modal">
  <div class="modal-content">
    <h2>🔭 Quiz Astronómico</h2>
    <div id="quizArea"></div>
    <button id="closeQuiz" style="margin-top:1rem; background:#ccc; border:none; padding:0.5rem; border-radius:20px;">Cerrar</button>
  </div>
</div>

<footer>🔭 Respuestas por IA (Groq 70B) · Herramientas gratuitas</footer>

<script>
  // ============================================================
  // URL del Worker de Cloudflare (ya configurada)
  // ============================================================
  let workerUrl = 'https://astro-groq-worker.dianaml76.workers.dev/';
  // ============================================================

  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let chatHistory = [];

  const SYSTEM_PROMPT_ASTRO = `Eres un tutor experto de astronomía para estudiantes de 12 a 18 años. Hablas español claro, divertido, con analogías sencillas. Respuestas cortas (máximo 3 párrafos) a menos que se pida resumen extenso. Usa emojis espaciales: 🌟🌍🪐🔭🚀. Puedes usar **negritas** y listas.`;

  function addMessage(role, text, rawMarkdown = true) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    let content = text;
    if (role === 'bot' && rawMarkdown) {
      content = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
    }
    div.innerHTML = `${content}<div class="timestamp">${time}</div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    if (role === 'user') chatHistory.push({ role: 'user', content: text });
    else if (role === 'bot') chatHistory.push({ role: 'assistant', content: text });
    if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);
    localStorage.setItem('astroChatHistory', JSON.stringify(chatHistory));
  }

  function loadHistory() {
    const saved = localStorage.getItem('astroChatHistory');
    if (saved) {
      try {
        chatHistory = JSON.parse(saved);
        for (let msg of chatHistory) {
          const div = document.createElement('div');
          div.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
          let content = msg.content;
          if (msg.role === 'assistant') content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          div.innerHTML = `${content}<div class="timestamp">—</div>`;
          messagesDiv.appendChild(div);
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch(e) { console.log('error carga'); }
    }
  }

  let typingDiv = null;
  function showTyping(show, text = "Pensando...") {
    if (show && !typingDiv) {
      typingDiv = document.createElement('div');
      typingDiv.className = 'typing';
      typingDiv.innerHTML = `<span>${text}</span><div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else if (!show && typingDiv) {
      typingDiv.remove();
      typingDiv = null;
    }
  }

  async function askGroq(userMessage, isResumen = false) {
    if (!workerUrl) {
      addMessage('bot', '⚠️ Error: URL del Worker no configurada. Contacta al administrador.');
      return null;
    }
    let messagesToSend = isResumen ? [{ role: 'user', content: userMessage }] : chatHistory.concat({ role: 'user', content: userMessage });
    try {
      const response = await fetch(workerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messagesToSend, systemPrompt: SYSTEM_PROMPT_ASTRO })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.reply;
    } catch (error) {
      console.error(error);
      addMessage('bot', '🔌 Error de conexión. El servicio no está disponible temporalmente.');
      return null;
    }
  }

  async function sendMessage(message, skipAddUser = false) {
    if (!message.trim()) return;
    if (!skipAddUser) addMessage('user', message);
    const esResumen = /resumen descargable|resumen en pdf|genera un resumen|resumen de/i.test(message);
    showTyping(true, esResumen ? "Generando resumen..." : "Consultando a la IA...");
    let reply;
    if (esResumen) {
      let tema = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim();
      if (!tema) tema = "astronomía";
      const promptResumen = `Genera un resumen extenso sobre "${tema}" de al menos 400 palabras, para estudiantes de 12 a 18 años. Incluye título, introducción, puntos clave y conclusión.`;
      reply = await askGroq(promptResumen, true);
    } else {
      reply = await askGroq(message);
    }
    showTyping(false);
    if (reply) {
      addMessage('bot', reply);
      if (esResumen) {
        const lastMsg = messagesDiv.lastChild;
        const btn = document.createElement('button');
        btn.textContent = '📥 Descargar PDF';
        btn.style.cssText = 'margin-top:8px; padding:4px 10px; border-radius:20px; border:none; background:#4a6fa5; color:white; cursor:pointer; font-size:0.75rem;';
        const temaPDF = message.replace(/resumen descargable|resumen en pdf|genera un resumen|resumen de/gi, '').trim() || "Astronomía";
        btn.onclick = () => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(16);
          doc.text(`Resumen: ${temaPDF}`, 20, 20);
          doc.setFontSize(11);
          const split = doc.splitTextToSize(reply.replace(/<[^>]*>/g, ''), 170);
          doc.text(split, 20, 35);
          doc.save(`resumen_${temaPDF.replace(/ /g,'_')}.pdf`);
        };
        lastMsg.appendChild(btn);
      }
    } else {
      addMessage('bot', 'No se pudo obtener respuesta. Inténtalo de nuevo más tarde.');
    }
  }

  function exportChatToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16);
    doc.text("Conversación AstroChat", 20, 20);
    let y = 35;
    for (let msg of chatHistory) {
      if (y > 270) { doc.addPage(); y = 20; }
      const prefix = msg.role === 'user' ? "👤 Tú: " : "🤖 AstroChat: ";
      const lines = doc.splitTextToSize(prefix + msg.content, 160);
      doc.text(lines, 20, y);
      y += lines.length * 6;
    }
    doc.save("chat_astronomia.pdf");
  }

  // Juego
  const quizModal = document.getElementById('quizModal');
  const quizArea = document.getElementById('quizArea');
  let currentQuestions = [], currentIndex = 0, score = 0;
  let bestScore = localStorage.getItem('astroBestScore') || 0;
  const questionBank = [
    { text: "¿Planeta más grande?", options: ["Marte","Júpiter","Saturno","Neptuno"], correct: "Júpiter" },
    { text: "¿Estrella central?", options: ["Sirio","Próxima Centauri","El Sol","Vega"], correct: "El Sol" },
    { text: "¿Galaxia vecina?", options: ["Andrómeda","Triángulo","Remolino"], correct: "Andrómeda" },
    { text: "¿Qué es un agujero negro?", options: ["Estrella muerta","Gravedad extrema","Planeta oscuro"], correct: "Gravedad extrema" },
    { text: "Temperatura del Sol?", options: ["5,500°C","15M°C","1,000°C"], correct: "5,500°C" },
    { text: "Telescopio famoso?", options: ["Hubble","James Webb","Spitzer"], correct: "Hubble" },
    { text: "¿Cuántos planetas (sin Plutón)?", options: ["7","8","9"], correct: "8" },
    { text: "Primer humano en la Luna?", options: ["Apolo 11","Artemis 1","Gemini 4"], correct: "Apolo 11" },
    { text: "Supernova es...", options: ["Explosión estelar","Cometa","Luna nueva"], correct: "Explosión estelar" },
    { text: "Planeta más caliente?", options: ["Venus","Mercurio","Marte"], correct: "Venus" }
  ];
  function getRandomQuestions(n) {
    const shuffled = [...questionBank];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, n);
  }
  function renderQuiz() {
    if (currentIndex >= currentQuestions.length) {
      const msg = `🎉 Acertaste ${score} de ${currentQuestions.length}. ${score > bestScore ? '¡NUEVO RÉCORD!' : ''}`;
      if (score > bestScore) { bestScore = score; localStorage.setItem('astroBestScore', bestScore); }
      quizArea.innerHTML = `<div>${msg}</div><div>Mejor: ${bestScore}</div><button id="newGameBtn" style="margin-top:1rem; background:#2c3e66; color:white; border:none; padding:0.5rem; border-radius:30px;">Nueva partida</button><button id="closeQuizAfter" style="margin-top:0.5rem;">Cerrar</button>`;
      document.getElementById('newGameBtn')?.addEventListener('click', startNewGame);
      document.getElementById('closeQuizAfter')?.addEventListener('click', () => quizModal.style.display = 'none');
      return;
    }
    const q = currentQuestions[currentIndex];
    let html = `<div class="quiz-question">${q.text}</div>`;
    q.options.forEach(opt => html += `<button class="quiz-option" data-answer="${opt}">${opt}</button>`);
    html += `<div>Puntuación: ${score}/${currentQuestions.length}</div>`;
    quizArea.innerHTML = html;
    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.onclick = () => {
        if (btn.getAttribute('data-answer') === q.correct) { score++; addFeedback("✅ Correcto!"); }
        else { addFeedback(`❌ Incorrecto. Respuesta: ${q.correct}`); }
        currentIndex++;
        renderQuiz();
      };
    });
  }
  function addFeedback(msg) { const fb = document.createElement('div'); fb.textContent = msg; fb.style.padding='0.3rem'; fb.style.background='#eef2f5'; fb.style.margin='0.5rem 0'; fb.style.borderRadius='20px'; quizArea.appendChild(fb); setTimeout(()=>fb.remove(), 1000); }
  function startNewGame() { currentQuestions = getRandomQuestions(5); currentIndex = 0; score = 0; renderQuiz(); }

  // Eventos
  sendBtn.onclick = () => { const msg = userInput.value.trim(); if(msg) { sendMessage(msg); userInput.value = ''; } };
  userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
  document.querySelectorAll('.menu-item[data-topic]').forEach(btn => {
    btn.onclick = () => sendMessage(`Explícame sobre ${btn.getAttribute('data-topic')} de forma divertida.`);
  });
  document.getElementById('summaryBtn').onclick = () => { const t = prompt('¿Tema del resumen?'); if(t) sendMessage(`Haz un resumen descargable de ${t}`); };
  document.getElementById('gameBtn').onclick = () => { if (!currentQuestions.length) startNewGame(); quizModal.style.display = 'flex'; renderQuiz(); };
  document.getElementById('closeQuiz').onclick = () => quizModal.style.display = 'none';
  document.getElementById('exportChatBtn').onclick = () => exportChatToPDF();
  document.getElementById('clearHistoryBtn').onclick = () => { if(confirm("Borrar historial?")) { chatHistory = []; localStorage.removeItem('astroChatHistory'); messagesDiv.innerHTML = ''; addMessage('bot', 'Historial borrado.'); } };
  document.getElementById('emergencyBtn').onclick = () => window.location.href = 'https://www.google.com';

  // Preguntas sugeridas
  const suggestionsDiv = document.getElementById('suggestions');
  ['¿Qué es un agujero negro?', '¿Cómo se forma una estrella?', '¿Por qué Marte es rojo?', '¿Qué es la Vía Láctea?'].forEach(q => {
    const btn = document.createElement('button');
    btn.textContent = q;
    btn.className = 'suggestion-btn';
    btn.onclick = () => sendMessage(q);
    suggestionsDiv.appendChild(btn);
  });

  // Inicializar
  loadHistory();
  addMessage('bot', '🌌 ¡Hola! Soy AstroChat. Pregúntame sobre el universo o usa el menú.');
</script>
</body>
</html>
